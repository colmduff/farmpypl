[tool.poetry]
name = "farmpypl"
version = "0.1.0"
description = "Income and organic-conversion calculator for an Irish dairy farm."
authors = ["Colm Duffy <colm.p.duffy@gmail.com>"]
license = "MIT"
readme = "README.md"
packages = [{ include = "farmpypl", from = "src" }]

[tool.poetry.dependencies]
python = "^3.11"
pydantic = "^2.13.5"
pandas = "^3.0.6"
openpyxl = {version = "^3.1.5", optional = true}  # only refresh_prices() needs it (Oil Bulletin .xlsx)

[tool.poetry.extras]
refresh = ["openpyxl"]

[tool.poetry.scripts]
farmpypl-refresh = "farmpypl.db.refresh:main"  # explicit refresh; calculations never fetch


[tool.poetry.group.dev.dependencies]
pytest = "*"
black = "*"
ipykernel = "*"
# Docs toolchain. Keep these constraints in sync with docs/requirements.txt,
# which Read the Docs installs.
#
# sphinx-autoapi >=3.8 is required: older AutoAPI calls astroid's
# ``AstroidBuilder()`` with no arguments, which astroid 4 rejects. AutoAPI
# swallows that TypeError as "Unable to read file" and emits an *empty* API
# reference while still exiting 0 - a green build with no API docs.
sphinx = ">=7.0"
sphinx-autoapi = ">=3.8"
myst-nb = ">=1.0"
sphinx-rtd-theme = ">=2.0"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["*_test.py", "test_*.py"]
addopts = "-m 'not network'"   # live API tests run only with: pytest -m network
markers = ["network: calls the real price APIs"]

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
